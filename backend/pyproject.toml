[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stargazer-dokkan-agent"
version = "0.1.0"
description = "渐进式披露 Skill 的 Dokkan 领域 Agent 后端"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "aiosqlite>=0.20,<1",
  "pyyaml>=6.0,<7",
  "httpx>=0.28,<1",
  "anyio>=4.8,<5",
]

[project.scripts]
dokkan-agent = "dokkan_agent.main:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0,<7",
]

# 当前开发网络直连 PyPI 超时；镜像地址显式入库，锁文件保留来源和文件哈希。
[[tool.uv.index]]
name = "pypi-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/dokkan_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
